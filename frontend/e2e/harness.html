<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser check harness</title>
  </head>
  <body>
    <!-- Only the dev server ever serves this (the build starts from index.html). It shows one component on its own, for the browser checks, when the throw-away database is too small for the page that normally holds it. -->
    <div id="root" style="max-width:640px;margin:24px auto;font-family:sans-serif"></div>
    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      import { Toaster } from 'react-hot-toast';
      import '/src/index.css';
      const which = new URLSearchParams(location.search).get('c') || 'PasskeyManager';
      const parts = {
        PasskeyManager: () => import('/src/core/components/account/PasskeyManager.jsx'),
        SealPhraseCard: () => import('/src/core/components/account/SealPhraseCard.jsx'),
        PasskeyRule: () => import('/src/core/pages/admin/PasskeyRule.jsx'),   // a whole page: it needs the router around it
        SensitiveActions: () => import('/src/core/pages/admin/SensitiveActions.jsx'),
        PaymentSettings: () => import('/src/core/pages/admin/settings/PaymentSettings.jsx'),
        Approvals: () => import('/src/core/pages/admin/Approvals.jsx'),
        MenusIngredients: () => import('/src/menus/pages/admin/Ingredients.jsx'),
        MenusDishes: () => import('/src/menus/pages/admin/Dishes.jsx'),
        MenusRecipes: () => import('/src/menus/pages/admin/Recipes.jsx'),
        MenusSettings: () => import('/src/menus/pages/admin/MenusSettings.jsx'),
        MenuCards: () => import('/src/menus/pages/admin/MenuCards.jsx'),
        Kiosk: () => import('/e2e/KioskProbe.jsx'),
        MenusFloor: () => import('/src/menus/pages/admin/MenusFloor.jsx'),
        TableGuest: () => import('/e2e/TableProbe.jsx'),
        MenusTill: () => import('/src/menus/pages/admin/MenusTill.jsx'),
        MenusKitchen: () => import('/src/menus/pages/admin/MenusKitchen.jsx'),
        MenusOrders: () => import('/src/menus/pages/admin/MenusOrders.jsx'),
        OrderTrack: () => import('/e2e/TrackProbe.jsx'),
        MenuPublic: () => import('/src/menus/pages/public/MenuPage.jsx'),
        ResetSigninMethods: () => import('/e2e/ResetProbe.jsx'),   // the "reset sign-in methods" window on its own (the real users page needs a far bigger database)
      };
      const { default: Component } = await parts[which]();
      if (['PasskeyRule', 'SensitiveActions', 'PaymentSettings', 'Approvals', 'MenusIngredients', 'MenusDishes', 'MenusRecipes', 'MenusSettings', 'MenuCards', 'MenusOrders', 'MenusKitchen', 'MenusTill', 'MenusFloor'].includes(which)) document.getElementById('root').style.maxWidth = 'none';   // (a whole page, not a card)
      const { BrowserRouter } = await import('react-router-dom');
      const { default: StepUpModal } = await import('/src/core/components/account/StepUpModal.jsx');   // (the app mounts it once; here it is part of the frame)
      createRoot(document.getElementById('root')).render(React.createElement(BrowserRouter, null, React.createElement(Toaster, { position: 'top-right' }), React.createElement(Component), React.createElement(StepUpModal)));
    </script>
  </body>
</html>
